<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Nos Casamos: Fati & Tú! 🥂</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
        .moving-btn {
            position: relative;
            transition: all 0.15s ease-out;
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-pink-50 via-purple-50 to-indigo-100 min-h-screen text-gray-800 flex flex-col items-center justify-center p-4 sm:p-6">

    <div class="max-w-2xl w-full bg-white/80 backdrop-blur-md shadow-2xl rounded-3xl p-6 sm:p-10 border border-white/55 my-8">
        
        <!-- Portada -->
        <header class="text-center mb-10">
            <span class="bg-pink-100 text-pink-600 text-xs sm:text-sm font-semibold px-3 py-1 rounded-full uppercase tracking-widest">¡Alerta de código rojo: Hay boda!</span>
            <h1 class="text-4xl sm:text-6xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-600 to-purple-600 mt-4 mb-2">
                Fati & Tú
            </h1>
            <p class="text-lg sm:text-xl font-medium text-gray-600 italic">"Decidimos arruinar nuestras finanzas y celebrar el amor"</p>
        </header>

        <!-- Formulario conectado a Formspree -->
        <form id="weddingForm" action="https://formspree.io/f/moejzbgy" method="POST" class="space-y-6">
            
            <!-- Nombre -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">¿Cómo te llamas, criatura del Señor?</label>
                <input type="text" name="nombre" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-pink-400 bg-white/50 transition" placeholder="Ej. Tu tía la chismosa / Tu mejor amigo">
            </div>

            <!-- Pregunta 1: Manda en el matrimonio -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">1. ¿Quién de los dos va a mandar en el matrimonio (seamos honestos)?</label>
                <select name="manda_matrimonio" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-pink-400 bg-white/50 transition">
                    <option value="fati_manda">Fati, mal que me pese (yo solo soy el decorado).</option>
                    <option value="yo_mando_mentira">Yo tengo voz de mando (mentira, me manejan con una sola mirada).</option>
                    <option value="anarquia">Ninguno, esto va a ser una anarquía total de amor y fernet.</option>
                </select>
            </div>

            <!-- Pregunta 2: Excusa para irse temprano -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">2. ¿Cuál es tu excusa argenta por si te querés rajar temprano?</label>
                <select name="excusa_irse" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-pink-400 bg-white/50 transition">
                    <option value="mal_piedra">Me dio el "mal de piedra" (no me muevo de la silla ni con grúa).</option>
                    <option value="perro">Tengo que ir a "darle de comer al perro" (a las 3 AM).</option>
                    <option value="tios">Me colgué hablando con los tíos de política y me bajó la presión.</option>
                </select>
            </div>

            <!-- Pregunta 3: Baile y vergüenza ajena -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">3. Si armamos trencito y hay competencia de baile post-escabio, ¿con qué estilo nos vas a dar vergüenza ajena?</label>
                <select name="estilo_baile" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-pink-400 bg-white/50 transition">
                    <option value="helicoptero">El "helicóptero" sin coordinación y transpirando la gota gorda.</option>
                    <option value="paso_prohibido">El paso prohibido de los 2000 que ya ni mis rodillas bancan.</option>
                    <option value="mesa_dulce">Me quedo al lado de la mesa dulce haciendo sociales para no papelonear.</option>
                </select>
            </div>

            <!-- Pregunta 4: Restricciones alimentarias -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">4. Restricciones alimentarias (¿Qué comemos?):</label>
                <input type="text" name="restricciones" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-pink-400 bg-white/50 transition" placeholder="Vegano, celíaco, aire, o 'como de todo'">
            </div>

            <!-- Botones de Confirmación (El caos interactivo) -->
            <div class="pt-4 text-center">
                <p class="text-sm font-bold text-gray-700 mb-3">¿Vienes a bancarnos en este papelón?</p>
                
                <!-- Campo oculto para saber qué botón apretó -->
                <input type="hidden" name="asistencia" id="asistenciaInput" value="Pendiente">

                <div id="botonesContainer" class="flex flex-col sm:flex-row items-center justify-center gap-4 relative min-h-[90px]">
                    <!-- Botón Sí -->
                    <button type="submit" id="btnYes" onclick="document.getElementById('asistenciaInput').value='Sí, ahí estaré';" class="w-full sm:w-auto bg-gradient-to-r from-green-500 to-emerald-600 text-white font-bold px-8 py-3 rounded-xl shadow-lg hover:shadow-xl hover:scale-105 transition transform">
                        ¡Sí, ahí estaré! 🎉
                    </button>

                    <!-- Botón No (Escurridizo con contador de intentos) -->
                    <button type="button" id="btnNo" onmouseover="handleNoInteraction()" onclick="handleNoInteraction()" class="moving-btn w-full sm:w-auto bg-gradient-to-r from-red-400 to-pink-500 text-white font-bold px-8 py-3 rounded-xl shadow-md">
                        No puedo ir 😢
                    </button>
                </div>
            </div>

        </form>

        <!-- Mensaje de éxito oculto -->
        <div id="successMessage" class="hidden text-center py-10">
            <h2 class="text-3xl font-bold text-pink-600 mb-2">¡Datos guardados con éxito! 🚀</h2>
            <p class="text-gray-600">Gracias por confirmar. Ya le avisamos al DJ que ponga cumbia.</p>
        </div>

    </div>

    <!-- Script de Movimiento y Formulario -->
    <script>
        const btnNo = document.getElementById('btnNo');
        let intentoNo = 0;
        const maxIntentos = 4;

        function handleNoInteraction() {
            intentoNo++;
            
            if (intentoNo < maxIntentos) {
                // Sigue escapando
                const x = Math.random() * (window.innerWidth < 640 ? 150 : 300) - 150;
                const y = Math.random() * 150 - 75;
                btnNo.style.transform = `translate(${x}px, ${y}px)`;
            } else {
                // ¡Lo atrapó! Mostramos el cartel gracioso
                alert('OAAAA, ¿creías que te íbamos a dejar que no vengas? 🤌✨');
                
                // Reemplazamos el botón "No" por el nuevo botón gracioso
                const container = document.getElementById('botonesContainer');
                btnNo.remove(); // Desaparece el botón del NO

                const btnNuevo = document.createElement('button');
                btnNuevo.type = 'button';
                btnNuevo.className = 'w-full sm:w-auto bg-gradient-to-r from-purple-500 to-indigo-600 text-white font-bold px-6 py-3 rounded-xl shadow-md hover:scale-105 transition transform';
                btnNuevo.innerText = '¿Otra vez querés intentar decir que no? 🤨';
                
                // Si hacen clic en este nuevo botón, redobla la apuesta con otra alerta y se vuelve a transformar en un chiste
                btnNuevo.onclick = function() {
                    alert('Spoiler: La respuesta correcta sigue siendo el botón verde de al lado. 😉');
                };

                container.appendChild(btnNuevo);
            }
        }

        const form = document.getElementById('weddingForm');
        form.addEventListener('submit', async function(e) {
            if(document.getElementById('asistenciaInput').value === 'Pendiente') {
                document.getElementById('asistenciaInput').value = 'Sí, ahí estaré';
            }

            e.preventDefault();
            const data = new FormData(form);
            
            try {
                const response = await fetch(form.action, {
                    method: form.method,
                    body: data,
                    headers: { 'Accept': 'application/json' }
                });

                if (response.ok) {
                    form.classList.add('hidden');
                    document.getElementById('successMessage').classList.remove('hidden');
                } else {
                    alert('Hubo un error al enviar el formulario. Inténtalo de nuevo.');
                }
            } catch (error) {
                form.classList.add('hidden');
                document.getElementById('successMessage').classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
