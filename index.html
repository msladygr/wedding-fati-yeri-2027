<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Nos Casamos: Fati & Yeri! 🌿🥂</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Llora / Lora y Playfair Display para un estilo rústico y elegante -->
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Playfair+Display:wght@600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Lora', serif;
            background-color: #f4f1ea; /* Tono lino/arena suave */
            color: #3b3a36;
        }
        h1, h2, h3 {
            font-family: 'Playfair Display', serif;
        }
        .moving-btn {
            position: relative;
            transition: all 0.15s ease-out;
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-[#f4f1ea] min-h-screen flex flex-col items-center justify-center p-4 sm:p-6">

    <!-- Contenedor principal estilo tarjeta rústica -->
    <div class="max-w-2xl w-full bg-[#fcfbfa] shadow-xl rounded-2xl p-6 sm:p-10 border border-[#e3ded2] my-8 relative overflow-hidden">
        
        <!-- Detalle decorativo superior campestre -->
        <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-[#8a9a86] via-[#b8a07e] to-[#6b7c65]"></div>

        <!-- Portada -->
        <header class="text-center mb-10 pt-4">
            <span class="bg-[#e8ede7] text-[#556b53] text-xs sm:text-sm font-semibold px-4 py-1.5 rounded-full uppercase tracking-widest border border-[#d2dfd0]">
                🌿 ¡Nos casamos al aire libre! 🌿
            </span>
            <h1 class="text-4xl sm:text-6xl font-extrabold text-[#3a4437] mt-5 mb-2">
                Fati & Yeri
            </h1>
            <p class="text-lg sm:text-xl font-medium text-[#7a7368] italic">"Decidimos arruinar nuestras finanzas y celebrar el amor bajo los árboles"</p>
        </header>

        <!-- Formulario conectado a Formspree -->
        <form id="weddingForm" action="https://formspree.io/f/moejzbgy" method="POST" class="space-y-6">
            
            <!-- Nombre -->
            <div>
                <label class="block text-sm font-semibold text-[#4a5547] mb-1">¿Quién chota sos?</label>
                <input type="text" name="nombre" required class="w-full px-4 py-3 rounded-xl border border-[#dcd6cc] focus:outline-none focus:ring-2 focus:ring-[#8a9a86] bg-white transition" placeholder="Ej. Tu tía la chismosa / Tu mejor amigo">
            </div>

            <!-- Pregunta 1: Manda en el matrimonio -->
            <div>
                <label class="block text-sm font-semibold text-[#4a5547] mb-1">1. ¿Quién de los dos va a mandar en el matrimonio (seamos honestos)?</label>
                <select name="manda_matrimonio" class="w-full px-4 py-3 rounded-xl border border-[#dcd6cc] focus:outline-none focus:ring-2 focus:ring-[#8a9a86] bg-white transition">
                    <option value="fati_manda">Yeri, obvio (Wah-pah!).</option>
                    <option value="yo_mando_mentira">Mas vale que Fati (mentira, la manejo con una sola mirada).</option>
                    <option value="anarquia">Ninguna, son las gatas las que mandan.</option>
                </select>
            </div>

            <!-- Pregunta 2: Excusa para irse temprano -->
            <div>
                <label class="block text-sm font-semibold text-[#4a5547] mb-1">2. ¿Qué excusa vas a usar por si te querés rajar temprano?</label>
                <select name="excusa_irse" class="w-full px-4 py-3 rounded-xl border border-[#dcd6cc] focus:outline-none focus:ring-2 focus:ring-[#8a9a86] bg-white transition">
                    <option value="mal_piedra">Me cayó mal la comida.</option>
                    <option value="perro">Tengo que ir a "darle de comer al perro" (a las 3 AM).</option>
                    <option value="tios">Me puse a hablar de fulbito y casi me agarro a las piñas.</option>
                </select>
            </div>

            <!-- Pregunta 3: Baile y vergüenza ajena -->
            <div>
                <label class="block text-sm font-semibold text-[#4a5547] mb-1">3. Si armamos trencito y hay competencia de baile post-escabio, ¿con qué estilo nos vas a dar vergüenza ajena?</label>
                <select name="estilo_baile" class="w-full px-4 py-3 rounded-xl border border-[#dcd6cc] focus:outline-none focus:ring-2 focus:ring-[#8a9a86] bg-white transition">
                    <option value="helicoptero">El "helicóptero" sin coordinación y transpirando abajo de los árboles.</option>
                    <option value="paso_prohibido">El meneaito hasta abajo con el ruido de tus rodillas.</option>
                    <option value="mesa_dulce">Me quedo al lado de la mesa dulce haciendo sociales para no morir de la verguenza (o del dolor).</option>
                </select>
            </div>

            <!-- Pregunta 4: Restricciones alimentarias -->
            <div>
                <label class="block text-sm font-semibold text-[#4a5547] mb-1">4. Restricciones alimentarias (¿Qué comemos en el asado/catering?):</label>
                <input type="text" name="restricciones" class="w-full px-4 py-3 rounded-xl border border-[#dcd6cc] focus:outline-none focus:ring-2 focus:ring-[#8a9a86] bg-white transition" placeholder="Vegano, celíaco, aire, o 'como de todo'">
            </div>

            <!-- Botones de Confirmación (El caos interactivo) -->
            <div class="pt-4 text-center">
                <p class="text-sm font-bold text-[#554d42] mb-3">¿Te esperamos?</p>
                
                <!-- Campo oculto para saber qué botón apretó -->
                <input type="hidden" name="asistencia" id="asistenciaInput" value="Pendiente">

                <div id="botonesContainer" class="flex flex-col sm:flex-row items-center justify-center gap-4 relative min-h-[90px]">
                    <!-- Botón Sí -->
                    <button type="submit" id="btnYes" onclick="document.getElementById('asistenciaInput').value='Sí, ahí estaré';" class="w-full sm:w-auto bg-[#6b7c65] hover:bg-[#556550] text-white font-semibold px-8 py-3 rounded-xl shadow-md transition transform hover:scale-105">
                        ¡Sí, ahí estaré! 🌳
                    </button>

                    <!-- Botón No (Escurridizo con contador de intentos) -->
                    <button type="button" id="btnNo" onmouseover="handleNoInteraction()" onclick="handleNoInteraction()" class="moving-btn w-full sm:w-auto bg-[#a87b6d] hover:bg-[#966b5e] text-white font-semibold px-8 py-3 rounded-xl shadow-md">
                        No puedo ir 🍃
                    </button>
                </div>
            </div>

        </form>

        <!-- Mensaje de éxito oculto -->
        <div id="successMessage" class="hidden text-center py-10">
            <h2 class="text-3xl font-bold text-[#556b53] mb-2">¡Datos guardados con éxito! 🌿</h2>
            <p class="text-[#7a7368]">Gracias por confirmar. Ya le avisamos al DJ para que ponga cumbia.</p>
        </div>

    </div>

    <!-- Script de Movimiento y Formulario -->
    <script>
        const btnNo = document.getElementById('btnNo');
        let intentoNo = 0;
        const maxIntentos = 4;

        function handleNoInteraction() {
            intentoNo++;
            
            if (intentoNo < maxIntentos) {
                const x = Math.random() * (window.innerWidth < 640 ? 150 : 300) - 150;
                const y = Math.random() * 150 - 75;
                btnNo.style.transform = `translate(${x}px, ${y}px)`;
            } else {
                alert('OAAAA, ¿creías que te íbamos a dejar que no vengas? 🤌🌿');
                
                const container = document.getElementById('botonesContainer');
                btnNo.remove();

                const btnNuevo = document.createElement('button');
                btnNuevo.type = 'button';
                btnNuevo.className = 'w-full sm:w-auto bg-[#8c7853] hover:bg-[#786544] text-white font-semibold px-6 py-3 rounded-xl shadow-md transition transform hover:scale-105';
                btnNuevo.innerText = 'Faaaa ¿otra vez querés poner que no? 🤨';
                
                btnNuevo.onclick = function() {
                    alert('Spoiler: La respuesta correcta sigue siendo el botón de al lado gil/a 😉');
                };

                container.appendChild(btnNuevo);
            }
        }

        const form = document.getElementById('weddingForm');
        form.addEventListener('submit', async function(e) {
            if(document.getElementById('asistenciaInput').value === 'Pendiente') {
                document.getElementById('asistenciaInput').value = 'Sí, ahí estaré';
            }

            e.preventDefault();
            const data = new FormData(form);
            
            try {
                const response = await fetch(form.action, {
                    method: form.method,
                    body: data,
                    headers: { 'Accept': 'application/json' }
                });

                if (response.ok) {
                    form.classList.add('hidden');
                    document.getElementById('successMessage').classList.remove('hidden');
                } else {
                    alert('Hubo un error al enviar el formulario. Inténtalo de nuevo.');
                }
            } catch (error) {
                form.classList.add('hidden');
                document.getElementById('successMessage').classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
